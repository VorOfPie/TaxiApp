spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/taxiapp-realm

      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/taxiapp-realm
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: taxiapp
            client-secret: c6O7xKiHdKAkmJE3UbPBy1MhbmveSpjY
            scope: openid

  datasource:
    url: jdbc:postgresql://localhost:5432/passenger_db
    username: username
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: db/changelog/main-changelog.xml
    enabled: true

server:
  port: 7001

passenger:
  scheduler:
    threadPoolSize: 10
    taskQueueSize: 100

logging:
  level:
    org.springframework.security: TRACE


---
spring.config.activate.on-profile: docker
server.port: 8080
