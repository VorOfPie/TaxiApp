spring:

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/taxiapp-realm

      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/taxiapp-realm
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: taxiapp
            client-secret: c6O7xKiHdKAkmJE3UbPBy1MhbmveSpjY
            scope: openid
  application:
    name: passenger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/passenger_db
    username: username
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:

  liquibase:
    change-log: db/changelog/main-changelog.xml
    enabled: true

server:
  port: 7001
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    initialInstanceInfoReplicationIntervalSeconds: 5
    registryFetchIntervalSeconds: 5
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 5

passenger:
  scheduler:
    threadPoolSize: 10
    taskQueueSize: 100


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1
    enabled: true

logging:
  level:
    root: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}", "level":"%p", "thread":"%t", "traceId":"%X{traceId}", "spanId":"%X{spanId}", "message":"%msg"}'
logging:
  level:
    org.springframework.security: TRACE



---
spring.config.activate.on-profile: docker
server.port: 8080
