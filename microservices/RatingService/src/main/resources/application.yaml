spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/taxiapp-realm

      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/taxiapp-realm
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: taxiapp
            client-secret: Xbfrxu5jJRqzK0C36c0WPOCovoLRerO3
            scope: openid
  application:
    name: rating-service
  datasource:
    url: jdbc:postgresql://localhost:5432/rating_db
    username: username
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true


  liquibase:
    change-log: db/changelog/main-changelog.xml
    enabled: true


  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: rating-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.value.default.type: com.modsen.taxi.ratingservice.dto.RatingRequest




server:
  port: 7004

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30




---
spring:
  config:
    activate:
      on-profile: docker
  kafka:
    bootstrap-servers: kafka:9092
server.port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1
    enabled: true

logging:
  level:
    root: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}", "level":"%p", "thread":"%t", "traceId":"%X{traceId}", "spanId":"%X{spanId}", "message":"%msg"}'

